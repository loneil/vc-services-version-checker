# ============================================================================
# VC Services Version Checker Configuration
# ============================================================================
# Format:
#   server|<openshift_api_url>
#   service|<name>|<repo_url>
#   env|<service>|<env_name>|<namespace>
#   query|<service>|<deployment_name>|<label>|<display_name>
#   query-deployment|<service>|<env>|<deployment_name>
#       (optional: overrides the deployment name for query| lines in a specific env)
#   api|<service>|<env>|<secret_name>|<secret_key>|<base_url>|<display_name>
#       (calls <base_url>/status and extracts "version" field, uses X-API-KEY header)
# ============================================================================

# OpenShift Server
server|https://api.silver.devops.gov.bc.ca:6443

# ============================================================================
# Traction
# ============================================================================
service|traction|https://github.com/bcgov/traction/

env|traction|dev|bc0192-dev
env|traction|test|bc0192-test
env|traction|prod|bc0192-prod
env|traction|sandbox|a99fd4-prod

query|traction|traction-tenant-proxy|app.kubernetes.io/version|Release Tag
query|traction|traction-tenant-proxy|helm.sh/chart|Helm Chart
# override the deployment name for the sandbox environment
query-deployment|traction|sandbox|traction-sandbox-tenant-proxy
# ----
api|traction|dev|traction-acapy-api|adminApiKey|https://traction-acapy-admin-dev.apps.silver.devops.gov.bc.ca|ACA-Py Version (API)
api|traction|test|traction-acapy-api|adminApiKey|https://traction-acapy-admin-test.apps.silver.devops.gov.bc.ca|ACA-Py Version (API)
api|traction|prod|traction-acapy-api|adminApiKey|https://traction-acapy-admin-prod.apps.silver.devops.gov.bc.ca|ACA-Py Version (API)
api|traction|sandbox|traction-sandbox-acapy-api|adminApiKey|https://traction-sandbox-acapy-admin.apps.silver.devops.gov.bc.ca|ACA-Py Version (API)

