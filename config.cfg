api|vc-authn-oidc|dev|vc-authn-oidc-agent-api|adminApiKey|https://vc-authn-oidc-agent-admin-dev.apps.silver.devops.gov.bc.ca|ACA-Py Version (API)
api|vc-authn-oidc|test|vc-authn-oidc-agent-api|adminApiKey|https://vc-authn-oidc-agent-admin-test.apps.silver.devops.gov.bc.ca|ACA-Py Version (API)
